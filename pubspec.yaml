name: voice_vault
description: "Voice Vault - Audio Recording App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  # Pinned so CI installs a deterministic Flutter release.
  # flutter-action reads this via `flutter-version-file: pubspec.yaml`.
  flutter: "3.44.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^5.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  audio_decoder: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
